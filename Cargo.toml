[package]
name = "tpl"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "derive",
] }
minijinja = "~2.24.0"
minijinja-contrib = "~2.24.0"
rustix = { version = "1.1.4", default-features = false, features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = [
    "mysql",
    "runtime-tokio",
    "tls-rustls-ring-webpki",
] }
thiserror = "2.0.20"
tokio = { version = "~1.53.1", features = ["rt", "time", "net"] }
toml = "1.1.6"
toml_edit = "0.25.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
