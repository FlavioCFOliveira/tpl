# `vendor/sqlx-core-0.9.0` and `vendor/sqlx-mysql-0.9.0` are third-party
# source, not workspace members: Cargo would otherwise make every path inside
# the workspace directory one, and the mandatory validation pipeline would run
# `-D warnings` over code this project does not own. See `ADR-010` and
# `ADR-014`; the one-package decision of `ADR-006` is unchanged by this table.
# `examples/rust-data-layer` is the crate the Rust worked example renders. It
# is excluded for the same reason and for one more: it is generated, it carries
# a dependency this package does not, and `cargo build` at the root must
# neither compile it nor fetch what it needs. Its compile gate is its own
# script, per `FR-EX-009`.
[workspace]
exclude = [
    "vendor/sqlx-core-0.9.0",
    "vendor/sqlx-mysql-0.9.0",
    "examples/rust-data-layer",
]

[package]
name = "tpl"
version = "0.0.2"
edition = "2024"
rust-version = "1.94.0"

# `dbg_macro` and the two `print_*` lints are in clippy's `restriction` group
# and are off by default, so `-D warnings` does not reach them. All three write
# straight to a standard stream, bypassing `src/diagnostics/` and the escaping
# `FR-ERR-024` applies there; `dbg!` also writes the value's `Debug`, which is
# how a credential leaves a type that redacts itself. A legitimate site carries
# a local `#[allow(...)]` with its reason — never a crate-level suppression.
# Every other `restriction` lint is its own decision and is not taken here.
[lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[dependencies]
# The counting global allocator of `ADR-011`, installed by the binary; its
# count is what the render memory limit of `FR-RND-039` bounds. No features:
# `stats` is refused there, and `nightly` needs a nightly toolchain.
cap = { version = "=0.1.2", default-features = false }
clap = { version = "4.6.6", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
    "derive",
] }
# `fuel` bounds every render by a count of evaluation steps (`FR-RND-036`).
minijinja = { version = "~2.24.0", features = ["fuel"] }
minijinja-contrib = "~2.24.0"
# The SQLite driver and library of `ADR-013` (`FR-LITE-001`), built from the
# bundled source with the options `.cargo/config.toml` adds. `limits` sets and
# reads back the limits of `FR-LITE-011`. `load_extension` stays off: the
# build compiles extension loading out, and that feature would not link.
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "limits"] }
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The MariaDB driver of `ADR-003`, taken as its two crates rather than through
# the `sqlx` facade. The facade's optional `sqlx-sqlite` requires
# `libsqlite3-sys` below 0.38, Cargo resolves optional dependencies into the
# lock file, and `links = "sqlite3"` then keeps `rusqlite` off the SQLite
# release `FR-LITE-039` requires. Each feature list is the set the facade
# resolved for these two crates with `mysql`, `runtime-tokio`,
# `tls-rustls-ring-webpki` and its own defaults, so both compile as before.
# The `_`-prefixed features are the ones the facade itself forwards; they are
# not public API, and the pin keeps them from moving.
sqlx-core = { version = "=0.9.0", features = [
    "_rt-tokio",
    "_tls-rustls-ring-webpki",
    "any",
    "json",
    "migrate",
    "offline",
] }
sqlx-mysql = { version = "=0.9.0", default-features = false, features = [
    "any",
    "json",
    "migrate",
    "offline",
] }
thiserror = "2.0.20"
tokio = { version = "~1.53.1", features = ["rt", "time", "net"] }
toml = "1.1.6"
toml_edit = "0.25.15"

# `trace` is the statement trace of `FR-LITE-018`, recorded by a
# `#[cfg(test)]` hook (`OD-37`). Under the edition-2024 resolver a feature
# enabled here reaches the test build and not `cargo build --release`, so the
# shipped binary carries neither the hook nor the binding (`ADR-013`, point 1).
# `default-features = false` keeps the test build from compiling `rusqlite`'s
# defaults, which the shipped build does not.
[dev-dependencies]
rusqlite = { version = "0.41.1", default-features = false, features = ["trace"] }

# Two vendored copies of the driver of `ADR-003`, each with a provenance and a
# retirement of its own in `vendor/README.md`; the pin is unchanged by either.
#
# `sqlx-core`: 0.9.0 never calls `set_nodelay`, which costs ~40 ms on every
# connection that negotiates TLS. The vendored copy adds the one statement
# upstream added in PR #4336. This entry is deleted, with the directory it
# points at, on the first `sqlx` release that carries the fix (`ADR-010`).
#
# `sqlx-mysql`: 0.9.0 requests the server's RSA public key over a session TLS
# does not protect, which `FR-MYSQL-045` forbids; sends a scramble of an empty
# or absent password, which `FR-CONF-055` forbids; and cannot report the phase
# a connection reached, which `FR-CONF-005` needs. The vendored copy refuses
# the key request with a typed error, sends the response the servers' own
# clients send for an empty password, and records the phase in a handle the
# caller passes (`ADR-014`, points 3, 5 and 6). Each part leaves on its own
# condition (`ADR-014`, point 7): the refusal, at the first `sqlx` release
# whose `sqlx-mysql` lets a caller refuse the request; the empty password, at
# the first that sends those responses at the first response and at every
# switch; and the handle, at the first that lets a caller learn the phase
# reached. This entry is deleted, with the directory it points at, with the
# last of them.
#
# Each entry goes on its own condition: the retirement of one leaves the other
# in force, and the table goes only with the last of them.
[patch.crates-io]
sqlx-core = { path = "vendor/sqlx-core-0.9.0" }
sqlx-mysql = { path = "vendor/sqlx-mysql-0.9.0" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
