# Publishes a GitHub Release for an already pushed v* tag (ADR-012). Started by
# hand only, against that tag:
#   gh workflow run release.yml --ref vX.Y.Z
# The gate job refuses any ref that is not a tag, then enforces the four
# provenance gates; each target then runs the five-command
# validation by its ADR-008 path and packages the release binary it built; the
# release is created only if everything passes.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

# One run per tag, never cancelled: a release must not stop mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # ADR-008 pins; a change here is a change to that record. Each download is
  # checked against the SHA-256 beside its pin, keyed by the runner's arch or
  # host triple.
  CARGO_ZIGBUILD_VERSION: 0.23.4
  CARGO_ZIGBUILD_SHA256_x86_64: 6b69963040818ca1ef573d8135a95aa902e17cf7f873c32c6426642dadfe7f59
  CARGO_ZIGBUILD_SHA256_aarch64: 25cf2cdc6cde848b33a761ff2cf46d1efe6ba7e1adfc4b6f3ee2d570cacb5419
  ZIG_VERSION: 0.16.0
  ZIG_SHA256_x86_64: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
  ZIG_SHA256_aarch64: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
  CARGO_AUDIT_VERSION: 0.22.2
  CARGO_AUDIT_SHA256_x86_64_unknown_linux_gnu: ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39
  CARGO_AUDIT_SHA256_aarch64_unknown_linux_gnu: c6603814ddaa45e51263dafd31c0ac98808f688d26f7395804f9670b0fd599dd
  CARGO_AUDIT_SHA256_x86_64_apple_darwin: 847831323de932155b226ab60ee4a180e13e5d007a019f0d4b7b4d89a6de2ab2
  CARGO_AUDIT_SHA256_aarch64_apple_darwin: ec7ca4263769593df4d909be85b94a6b79efa2897be5d2bb8ebd516e823175af

defaults:
  run:
    shell: bash

jobs:
  # ADR-012 Decision 3: the four gates, in order, before anything is built.
  gate:
    runs-on: ubuntu-26.04
    outputs:
      notes: ${{ steps.gate.outputs.notes }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - id: gate
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          fail() {
            echo "::error::$*"
            exit 1
          }

          # 0. The run was dispatched against a tag.
          [[ "$REF_TYPE" == tag ]] ||
            fail "release.yml must be dispatched against a tag, not a $REF_TYPE ($TAG): gh workflow run release.yml --ref vX.Y.Z"

          # 1. The tagged commit is on main.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main ||
            fail "could not fetch main from origin"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            fail "tag $TAG points at $GITHUB_SHA, which is not an ancestor of origin/main"

          # 2. The tag is annotated. It is fetched explicitly because checkout
          # may leave a lightweight copy of it (actions/checkout#290).
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG" ||
            fail "could not fetch tag $TAG from origin"
          [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]] ||
            fail "tag $TAG is lightweight; a release tag must be annotated"

          # 3. v + a SemVer 2.0.0 version (semver.org, numbered capture groups)
          # equal to the [package] version in Cargo.toml.
          [[ "$TAG" == v* ]] || fail "tag $TAG does not start with v"
          version="${TAG#v}"
          semver='^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
          grep -qP "$semver" <<< "$version" ||
            fail "tag $TAG is not v followed by a Semantic Versioning 2.0.0 version"
          package="$(awk '/^\[/ { p = ($0 == "[package]") }
            p && /^version *=/ { sub(/^version *= *"/, ""); sub(/".*$/, ""); print; exit }' Cargo.toml)"
          [[ "$version" == "$package" ]] ||
            fail "tag $TAG does not match version \"$package\" in Cargo.toml"

          # 4. Exactly one release-notes/<tag>-<YYYYMMDD>.md; the tag is
          # compared as a literal string, never as a pattern.
          notes=()
          for file in release-notes/*; do
            name="${file#release-notes/}"
            if [[ -f "$file" && "$name" == "$TAG"-* && "${name#"$TAG"-}" =~ ^[0-9]{8}\.md$ ]]; then
              notes+=("$file")
            fi
          done
          [[ "${#notes[@]}" -eq 1 ]] ||
            fail "expected exactly one release-notes/$TAG-YYYYMMDD.md, found ${#notes[@]}: ${notes[*]}"

          prerelease=false
          if [[ "${version%%+*}" == *-* ]]; then prerelease=true; fi
          echo "notes=${notes[0]}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "gate passed: $TAG, notes ${notes[0]}, prerelease $prerelease"

  build:
    needs: gate
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
            cargo: cargo-zigbuild
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04-arm
            cargo: cargo-zigbuild
          - target: x86_64-apple-darwin
            os: macos-26-intel
            cargo: cargo
          - target: aarch64-apple-darwin
            os: macos-26
            cargo: cargo
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain and tools
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Downloads $1 to $2 and fails unless its SHA-256 is $3.
          fetch() {
            curl -fsSL -o "$2" "$1"
            if [[ "$RUNNER_OS" == Linux ]]; then
              echo "$3  $2" | sha256sum -c -
            else
              echo "$3  $2" | shasum -a 256 -c -
            fi
          }
          cd "$RUNNER_TEMP"

          toolchain="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' "$GITHUB_WORKSPACE/Cargo.toml")"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy --target "$TARGET"
          rustup default "$toolchain"

          host="$(rustc -vV | sed -n 's/^host: //p')"
          audit="cargo-audit-${host}-v${CARGO_AUDIT_VERSION}"
          sha="CARGO_AUDIT_SHA256_${host//-/_}"
          fetch "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/${audit}.tgz" \
            "${audit}.tgz" "${!sha}"
          tar -xzf "${audit}.tgz" --strip-components=1 -C "$HOME/.cargo/bin" "${audit}/cargo-audit"

          if [[ "$TARGET" == *-linux-musl ]]; then
            arch="$(uname -m)"
            zig="zig-${arch}-linux-${ZIG_VERSION}"
            sha="ZIG_SHA256_${arch}"
            fetch "https://ziglang.org/download/${ZIG_VERSION}/${zig}.tar.xz" "${zig}.tar.xz" "${!sha}"
            tar -xJf "${zig}.tar.xz"
            echo "$RUNNER_TEMP/${zig}" >> "$GITHUB_PATH"

            zigbuild="cargo-zigbuild-${arch}-unknown-linux-gnu"
            sha="CARGO_ZIGBUILD_SHA256_${arch}"
            fetch "https://github.com/rust-cross/cargo-zigbuild/releases/download/v${CARGO_ZIGBUILD_VERSION}/${zigbuild}.tar.xz" \
              "${zigbuild}.tar.xz" "${!sha}"
            tar -xJf "${zigbuild}.tar.xz" --strip-components=1 -C "$HOME/.cargo/bin" "${zigbuild}/cargo-zigbuild"
          fi

      - run: cargo fmt --all -- --check
      - run: ${{ matrix.cargo }} clippy --target ${{ matrix.target }} --all-targets --all-features -- -D warnings
      - run: ${{ matrix.cargo }} build --target ${{ matrix.target }} --release
      - run: ${{ matrix.cargo }} test --target ${{ matrix.target }} --all-features
      - run: cargo audit

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          # macOS bsdtar would otherwise store extended attributes (ADR-012);
          # GNU tar on Linux takes neither flag.
          flags=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            flags=(--no-mac-metadata --no-xattrs)
          fi
          tar "${flags[@]}" -czf "tpl-${TAG}-${TARGET}.tar.gz" \
            -C "target/${TARGET}/release" tpl \
            -C "$GITHUB_WORKSPACE" README.md LICENSE CHANGELOG.md

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: tpl-${{ matrix.target }}
          path: tpl-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [gate, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: tpl-*
          merge-multiple: true
          path: dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.gate.outputs.notes }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        run: |
          cd dist
          sha256sum tpl-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --notes-file "$GITHUB_WORKSPACE/$NOTES" "${flags[@]}" tpl-*.tar.gz SHA256SUMS
